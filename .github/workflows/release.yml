name: Release
# Releases happen when the version in Cargo.toml changes on main (or on demand): the workflow tags v<version>,
# builds native binaries for five targets, packages them, and publishes a GitHub release.
# A pushed v* tag also works as a manual trigger.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($tag)"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - run: bash scripts/verify
  build:
    needs: [plan, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { name: darwin-x64, target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { name: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, smoke: true }
          - { name: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, smoke: true }
          - { name: windows-x64, target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        run: |
          bin=target/${{ matrix.target }}/release/migadu
          [ "${{ runner.os }}" = Windows ] && bin="$bin.exe"
          "$bin" --help | head -n 3
          out=$(MIGADU_EMAIL=a@b.c MIGADU_API_KEY=SUPERSECRET123 MIGADU_DOMAIN=nope.invalid "$bin" mailboxes list 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q SUPERSECRET123; then echo "secret leaked"; exit 1; fi
      - name: Package
        run: |
          v="${{ needs.plan.outputs.tag }}"
          d="migadu-$v-${{ matrix.name }}"
          mkdir -p "$d" dist
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/migadu$ext" LICENSE README.md "$d/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a -tzip "dist/$d.zip" "$d" >/dev/null
          else tar -czf "dist/$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "release-${{ matrix.name }}", path: dist/*, if-no-files-found: error }
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "release-*", path: dist, merge-multiple: true }
      - name: Source package and checksums
        run: |
          cargo package --locked --allow-dirty --quiet
          cp target/package/*.crate dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Tag and publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ needs.plan.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${{ needs.plan.outputs.tag }}" --generate-notes
