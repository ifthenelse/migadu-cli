name: Release
# Push a tag like v0.2.0 (it must equal package.json "version") to build stand-alone binaries and publish a GitHub release.
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bash scripts/verify
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.5 }
      - name: Compile one binary per target
        run: |
          mkdir dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build --compile --target=bun-$t bin/migadu.js --outfile "dist/migadu-$t$ext"
          done
      - name: Smoke test the Linux binary
        run: |
          ./dist/migadu-linux-x64 --help | head -n 3
          out=$(MIGADU_EMAIL=a@b.c MIGADU_API_KEY=SUPERSECRET123 ./dist/migadu-linux-x64 domains list 2>&1 || true)
          if echo "$out" | grep -q SUPERSECRET123; then echo "secret leaked"; exit 1; fi
      - name: Checksums
        run: cd dist && sha256sum migadu-* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: binaries, path: dist/*, if-no-files-found: error }
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: binaries, path: dist }
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
