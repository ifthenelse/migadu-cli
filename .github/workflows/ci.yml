# CI is the authoritative gate. Pin actions to commit SHAs if your policy requires it.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  # Branching policy: pull requests come from <type>/<short-description> branches (or tool-created ones).
  # GitHub rulesets cannot enforce branch names on personal repositories, so CI does.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env: { HEAD_REF: "${{ github.head_ref }}" }
        run: |
          re='^((feat|fix|docs|ci|chore|refactor|test|perf|build|style|revert)/[a-z0-9._-]+|dependabot/.+|alert-autofix-[0-9]+|copilot/.+)$'
          if ! printf '%s' "$HEAD_REF" | grep -Eq "$re"; then
            echo "branch '$HEAD_REF' does not match <type>/<short-description> (types: feat fix docs ci chore refactor test perf build style revert)"; exit 1
          fi
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (stable)
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - run: bash scripts/verify
  # The oldest Rust the crate promises to build with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - run: cargo +1.85 check --locked --all-targets
