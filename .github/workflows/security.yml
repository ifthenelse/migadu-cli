name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 4 * * 1" }]
permissions: { contents: read }
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { languages: rust, build-mode: none }
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
  # A CLI has no running service to attack; "pentest" here is SAST + a negative-input check
  # that credentials and shell metacharacters never reach a shell or get echoed.
  pentest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (OWASP + secrets rulesets)
        run: |
          pipx install semgrep
          semgrep scan --error --config p/owasp-top-ten --config p/secrets .
      - name: No shell execution anywhere in src
        run: "! grep -nE 'Command::new\\(\"(sh|bash|zsh|cmd|powershell|pwsh)\"|\"-c\"|\"/C\"' -r src"
      - name: Credentials never echoed on failure
        run: |
          cargo build --release --locked
          out=$(MIGADU_EMAIL=a@b.c MIGADU_API_KEY=SUPERSECRET123 MIGADU_DOMAIN=nope.invalid ./target/release/migadu mailboxes list 2>&1 || true)
          if echo "$out" | grep -q SUPERSECRET123; then echo "secret leaked"; exit 1; fi
