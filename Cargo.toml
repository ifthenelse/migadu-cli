[package]
name = "migadu-cli"
version = "0.4.4"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform CLI for the Migadu email hosting API, with password-manager credential lookup."
license = "MIT"
repository = "https://github.com/ifthenelse/migadu-cli"
readme = "README.md"
keywords = ["migadu", "email", "cli", "1password", "bitwarden"]
categories = ["command-line-utilities"]

[lib]
name = "migadu"
path = "src/lib.rs"

[[bin]]
name = "migadu"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
